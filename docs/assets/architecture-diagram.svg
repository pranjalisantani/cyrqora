        <text x="14" y="22" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#00f0ff">01 // People & Team Constellation</text>
        <text x="14" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#94a3b8">PeopleSection.tsx • PersonDetailModal.tsx</text>
        <text x="14" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Core Executives, Tech Leads, Research, Alumni</text>
        <text x="14" y="76" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">• Interactive Modal Dossier with GitHub / LinkedIn</text>
      </g>

      <!-- Module 2: Events -->
      <g transform="translate(360, 0)">
        <rect width="338" height="98" rx="6" fill="#030713" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#00f0ff">02 // Events & Workshop Radar</text>
        <text x="14" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#94a3b8">EventsSection.tsx • EventDetailModal.tsx</text>
        <text x="14" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Hybrid, In-Person & Virtual Symposiums</text>
        <text x="14" y="76" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">• Learning Outcomes, Syllabus & Photo Records</text>
      </g>

      <!-- Module 3: What We Do -->
      <g transform="translate(720, 0)">
        <rect width="338" height="98" rx="6" fill="#030713" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#00f0ff">03 // 4 Chapter Pillars</text>
        <text x="14" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#94a3b8">WhatWeDoPreview.tsx</text>
        <text x="14" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• 01: Workshops (Hands-on Systems Labs)</text>
        <text x="14" y="76" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">• 02: Projects • 03: Reading Groups • 04: Hackathons</text>
      </g>

      <!-- Module 4: Selected Projects -->
      <g transform="translate(0, 116)">
        <rect width="338" height="106" rx="6" fill="#030713" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">04 // Student Software & Repos</text>
        <text x="14" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#94a3b8">FeaturedProjects.tsx • ProjectsSection.tsx</text>
        <text x="14" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Systems tools, ICPC libraries, open compilers</text>
        <text x="14" y="76" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">• Structured Problem / Approach / Architecture specs</text>
      </g>

      <!-- Module 5: Join Chapter Portal -->
      <g transform="translate(360, 116)">
        <rect width="338" height="106" rx="6" fill="#030713" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">05 // Membership & Onboarding</text>
        <text x="14" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#94a3b8">JoinSection.tsx</text>
        <text x="14" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• The 4 Verbs: LEARN, BUILD, CONNECT, CREATE</text>
        <text x="14" y="76" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">• Application form modal with department vector triage</text>
      </g>

      <!-- Module 6: Senior Review Drawer -->
      <g transform="translate(720, 116)">
        <rect width="338" height="106" rx="6" fill="#030713" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">06 // Senior Review & Spec Drawer</text>
        <text x="14" y="40" font-family="'Geist Mono', monospace" font-size="9" fill="#94a3b8">ReviewDrawer.tsx • Global Navbar Trigger</text>
        <text x="14" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">• Slideout walkthrough of 15 interactive modules</text>
        <text x="14" y="76" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">• Distinguishes Real Engines vs Structural Placeholders</text>
      </g>
    </g>
  </g>
</svg>
