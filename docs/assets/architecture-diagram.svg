      <text x="364" y="20" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">Scroll Scrubbing & Camera Vectors</text>
      <text x="364" y="36" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">• Continuous timeline: 0.0 -> 0.25 -> 0.52 -> 0.78 -> 1.0</text>
      <text x="364" y="52" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">• Interpolated fov, camera rotX/rotY, Euclidean distance lines</text>

      <!-- 3 Narrative Beats -->
      <rect x="740" width="328" height="66" rx="6" fill="#030816" stroke="#4ade80" stroke-width="1" stroke-opacity="0.3"/>
      <text x="754" y="20" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#4ade80">Continuous Story Beats</text>
      <text x="754" y="36" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">• Beat 1: Foundation (Scientific Rigor & Charter)</text>
      <text x="754" y="52" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">• Beat 2: Convergence (Systems) • Beat 3: Community</text>
    </g>
  </g>

