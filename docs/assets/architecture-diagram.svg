<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#040d21"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08142c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#040b18" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="680" fill="url(#archBg)"/>
  <rect width="1200" height="680" fill="url(#archGrid)"/>

  <!-- Border & Crosshairs -->
  <rect x="20" y="20" width="1160" height="640" rx="10" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.15"/>
  <path d="M 12 20 L 28 20 M 20 12 L 20 28" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M 1172 20 L 1188 20 M 1180 12 L 1180 28" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M 12 660 L 28 660 M 20 652 L 20 668" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M 1172 660 L 1188 660 M 1180 652 L 1180 668" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.7"/>

