      <text x="14" y="20" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#00f0ff">NetworkCanvas.tsx</text>
      <text x="14" y="36" font-family="system-ui, sans-serif" font-size="9.5" fill="#cbd5e1">• HTML5 2D Context + 3D Camera Projection</text>
      <text x="14" y="52" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">• 80 Nodes • 4 Spatial Clusters • Velocity Physics</text>

      <!-- Scrub Connection -->
