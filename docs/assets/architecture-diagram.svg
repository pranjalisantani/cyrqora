  <text x="940" y="52" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b" letter-spacing="1">NEXT.js 16 • CLIENT-ORCHESTRATED</text>
  <line x1="20" y1="68" x2="1180" y2="68" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- ======================================================== -->
  <!-- LAYER 1: CLIENT RUNTIME & VIEWPORT ORCHESTRATION (TOP)   -->
  <!-- ======================================================== -->
  <g transform="translate(46, 88)">
    <rect width="1108" height="96" rx="8" fill="url(#cardGrad)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.25"/>
    <rect x="0" y="0" width="6" height="96" rx="2" fill="#00f0ff"/>
    
    <text x="24" y="26" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1.5">01 // PRESENTATION & VIEWPORT ORCHESTRATION LAYER</text>
    
    <g transform="translate(24, 42)">
      <!-- Box 1A -->
      <rect width="250" height="42" rx="5" fill="#030814" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="19" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#f8fafc">Next.js 16 App Router</text>
      <text x="14" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">App/layout.tsx • App/page.tsx</text>

      <!-- Box 1B -->
      <rect x="268" width="260" height="42" rx="5" fill="#030814" stroke="#1e293b" stroke-width="1"/>
      <text x="282" y="19" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#00f0ff">Tailwind CSS v4 System</text>
      <text x="282" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Glassmorphic tokens, grids, glow filters</text>

      <!-- Box 1C -->
      <rect x="546" width="260" height="42" rx="5" fill="#030814" stroke="#1e293b" stroke-width="1"/>
      <text x="560" y="19" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#4ade80">GSAP ScrollTrigger Engine</text>
      <text x="560" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">MatchMedia queries • Scrub 1.1 • Pinning</text>

      <!-- Box 1D -->
      <rect x="824" width="244" height="42" rx="5" fill="#030814" stroke="#1e293b" stroke-width="1"/>
      <text x="838" y="19" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="600" fill="#e2e8f0">Accessibility & Modals</text>
      <text x="838" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Reduced Motion • Esc Trap • Body Lock</text>
    </g>
  </g>

